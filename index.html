<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星を放つ夜 ONLINE</title>
<style>
body{margin:0;background:#0b1030;color:#eef;font-family:sans-serif}
#app{max-width:900px;margin:auto;padding:10px}
button{font-size:15px;padding:8px 12px;margin:3px;border:0;border-radius:8px;background:#5a6bff;color:#fff;cursor:pointer}
button.g{background:#445}button:disabled{opacity:.4}
input{font-size:16px;padding:8px;border-radius:8px;border:0;margin:3px}
.box{background:#161d4a;border-radius:12px;padding:10px;margin:8px 0}
.bds{display:flex;flex-wrap:wrap;gap:8px}
.bd{background:#161d4a;border-radius:12px;padding:8px;border:3px solid transparent}
.bd.turn{border-color:#ffd54f}
.cols{display:flex;gap:6px;align-items:flex-start}
.col{width:46px;min-height:70px;padding-bottom:4px;background:#0003;border-radius:6px}
.col.ok{outline:2px dashed #fff9;cursor:pointer}
.cd{display:block;width:46px;height:40px;line-height:40px;text-align:center;border-radius:6px;margin-top:-26px;border:2px solid #fff5;box-sizing:border-box;color:#fff;text-shadow:0 0 3px #000;font-weight:bold;position:relative}
.cd:first-child{margin-top:0}
.cd.bt{box-shadow:0 0 8px 2px #fff}
.sm .col{width:30px;min-height:50px}.sm .cd{width:30px;font-size:11px;height:28px;line-height:24px;margin-top:-18px}
.chip{display:inline-block;width:40px;height:40px;line-height:40px;text-align:center;border-radius:8px;margin:3px;font-weight:bold;color:#fff;text-shadow:0 0 3px #000;border:3px solid transparent;cursor:pointer}
.chip.sel{border-color:#fff}.chip.dim{opacity:.35}
.pair{display:inline-block;background:#0004;border-radius:8px;padding:4px;margin:4px}
.nm{font-size:13px;margin-bottom:4px}
</style></head><body><div id="app">接続中…</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ★ここにFirebaseの設定を貼る(databaseURL必須)
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const FB = {
  apiKey: "AIzaSyDgO5SGmtolUhtZxtIdB8OXZuXIQLeRhO0",
  authDomain: "hoshihanatsu.firebaseapp.com",
  databaseURL: "https://hoshihanatsu-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hoshihanatsu",
  storageBucket: "hoshihanatsu.firebasestorage.app",
  messagingSenderId: "282472319491",
  appId: "1:282472319491:web:bb854cd069b6186b20dc36",
  measurementId: "G-7C0FVNW1FM"
};
firebase.initializeApp(FB);
const db=firebase.database();
const COL={R:'#e53935',B:'#1e88e5',Y:'#f9a825',G:'#43a047',P:'#8e24aa'},JP={R:'赤',B:'青',Y:'黄',G:'緑',P:'紫'},K='RBYGP';
const rc=()=>K[Math.random()*5|0],rp=()=>rc()+rc(),cp=o=>JSON.parse(JSON.stringify(o));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let uid,code,room,g,sel=0,mode='x',asg=[],ps=-1,cpuT=null;
firebase.auth().signInAnonymously().then(r=>{uid=r.user.uid;render()}).catch(e=>{$('app').textContent='ログイン失敗: '+e.message});

/* ---------- ロビー ---------- */
function nm(){const v=$('nm').value.trim()||'名無し';localStorage.hn=v;return v}
function mk(){const n=nm();code=String(Math.random()*1e4|0).padStart(4,'0');
 db.ref('rooms/'+code).set({host:uid,players:{[uid]:{n,t:Date.now()}}}).then(listen)}
function jn(){const n=nm();code=$('cd').value.trim();
 db.ref('rooms/'+code).once('value').then(s=>{const r=s.val();
  if(!r){code=null;return alert('部屋がありません')}
  if(r.g){code=null;return alert('ゲーム開始済みです')}
  if(Object.keys(r.players||{}).length>=5&&!r.players[uid]){code=null;return alert('満員です')}
  return db.ref('rooms/'+code+'/players/'+uid).set({n,t:Date.now()}).then(listen)})}
function listen(){db.ref('rooms/'+code).on('value',s=>{room=s.val();g=room&&room.g;render();cpuCheck()})}
function addCpu(){const k=Object.keys(room.players).length;if(k>=5)return;
 const c=Object.values(room.players).filter(p=>p.c).length+1;
 db.ref('rooms/'+code+'/players/cpu'+Date.now()).set({n:'CPU'+c,c:1,t:Date.now()})}
function start(){const ps=Object.entries(room.players).sort((a,b)=>a[1].t-b[1].t).map(([id,p])=>({id,name:p.n,cpu:p.c?1:0}));
 for(let i=ps.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ps[i],ps[j]]=[ps[j],ps[i]]}
 db.ref('rooms/'+code+'/g').set({v:1,pl:ps,b:ps.map(()=>[...K]),s:ps.map(()=>0),inbox:ps.map(()=>''),
  nx:[rp(),rp()],t:0,ph:'pick',hand:'',free:0,combo:0,push:'',log:'ゲーム開始！',win:-1})}

/* ---------- ゲームロジック ---------- */
function commit(n){n.v=g.v+1;const v=g.v;
 db.ref('rooms/'+code+'/g').transaction(c=>(c===null||c.v===v)?n:undefined)}
function judge(n){const b=n.b[n.t],cnt={};
 b.forEach(c=>{if(c){const x=c[c.length-1];cnt[x]=(cnt[x]||0)+1}});
 const col=Object.keys(cnt).find(k=>cnt[k]>=3);
 if(!col){ // 連鎖終了
  if(n.push){ if(n.pl.length===2){n.inbox[1-n.t]+=n.push;endTurn(n)} else n.ph='push' }
  else endTurn(n);
  return}
 const m=cnt[col];n.combo++;const pt=[0,0,0,1,3,10][m]+n.combo-1;n.s[n.t]+=pt;n.push+=col;
 b.forEach((c,i)=>{if(c&&c[c.length-1]===col)b[i]=c.slice(0,-1)});
 n.log=n.pl[n.t].name+'：流星魔法！'+JP[col]+'×'+m+'（'+n.combo+'コンボ +'+pt+'点）';
 n.ph='bonus'}
function endTurn(n){n.combo=0;n.push='';n.hand='';n.free=0;
 if(n.t===n.pl.length-1&&n.s.some(x=>x>=20)){n.ph='over';n.win=n.s.indexOf(Math.max(...n.s));return}
 n.t=(n.t+1)%n.pl.length;n.ph='pick'}
function aPick(n,i){let p;if(i<0)p=rp();else{p=n.nx[i];n.nx[i]=rp()}
 n.hand=p+n.inbox[n.t];n.inbox[n.t]='';n.free=2;n.ph='place';n.log=n.pl[n.t].name+'：カードを置く'}
function aPlace(n,hi,col){if(hi>=Math.max(n.free,1)||hi>=n.hand.length)return 0;
 const c=n.hand[hi];n.hand=n.hand.slice(0,hi)+n.hand.slice(hi+1);n.b[n.t][col]+=c;
 if(n.free>0)n.free--;if(!n.hand)judge(n);return 1}
function aBonus(n,m,col){const b=n.b[n.t];
 if(m==='x'){if(!b[col])return 0;b[col]=b[col].slice(0,-1)}else b[col]+=rc();
 judge(n);return 1}
function aPush(n,a){a.forEach(x=>n.inbox[x.to]+=x.c);endTurn(n)}

/* ---------- CPU ---------- */
function maxSame(b){const o={};let m=0;b.forEach(c=>{if(c){const x=c[c.length-1];o[x]=(o[x]||0)+1;m=Math.max(m,o[x])}});return m}
function best(b,card){let bs=-1,cs=[];b.forEach((c,i)=>{const t=b.slice();t[i]=c+card;const m=maxSame(t);
 if(m>bs){bs=m;cs=[i]}else if(m===bs)cs.push(i)});return cs[Math.random()*cs.length|0]}
function cpuCheck(){clearTimeout(cpuT);if(!g||g.ph==='over'||room.host!==uid||!g.pl[g.t].cpu)return;
 const v=g.v;cpuT=setTimeout(()=>{if(g&&g.v===v)cpuAct()},1100)}
function cpuAct(){const n=cp(g),b=n.b[n.t];
 if(n.ph==='pick'){const sc=n.nx.map(p=>{const t=b.slice();for(const ch of p){const i=best(t,ch);t[i]+=ch}return maxSame(t)});
  aPick(n,sc[0]>=sc[1]?0:1)}
 else if(n.ph==='place')aPlace(n,0,best(b,n.hand[0]));
 else if(n.ph==='bonus'){const c=rc();aBonus(n,'d',best(b,c))}
 else if(n.ph==='push'){const o=n.pl.map((_,i)=>i).filter(i=>i!==n.t).sort((a,c)=>n.s[c]-n.s[a]);
  aPush(n,[...n.push].map(c=>({c,to:o[0]})))}
 commit(n)}

/* ---------- 操作 ---------- */
const myTurn=()=>g&&g.ph!=='over'&&g.pl[g.t].id===uid;
function pk(i){if(!myTurn()||g.ph!=='pick')return;const n=cp(g);aPick(n,i);sel=0;commit(n)}
function colClick(ci){if(!myTurn())return;const n=cp(g);
 if(g.ph==='place'){if(!aPlace(n,sel,ci))return;sel=0}
 else if(g.ph==='bonus'){if(!aBonus(n,mode,ci))return}else return;commit(n)}
function setSel(i){sel=i;render()}
function setMode(m){mode=m;render()}
function selPush(i){if(!asg.some(a=>a.i===i)){ps=i;render()}}
function giveTo(to){if(ps<0)return;asg.push({i:ps,to,c:g.push[ps]});ps=-1;
 if(asg.length===g.push.length){const n=cp(g);aPush(n,asg);asg=[];commit(n)}else render()}
function resetAsg(){asg=[];ps=-1;render()}

/* ---------- 描画 ---------- */
function boardH(i,small){const b=g.b[i],ok=!small&&myTurn()&&(g.ph==='place'||g.ph==='bonus');
 return `<div class="bd ${small?'sm':''} ${i===g.t&&g.ph!=='over'?'turn':''}"><div class="nm">${esc(g.pl[i].name)}${g.pl[i].cpu?'(CPU)':''} <b>${g.s[i]}点</b>${g.inbox[i]?' ／押し付け:'+[...g.inbox[i]].map(x=>JP[x]).join(''):''}</div><div class="cols">`+
 b.map((c,ci)=>`<div class="col ${ok?'ok':''}" ${ok?`onclick="colClick(${ci})"`:''}>`+[...c].map((x,k)=>`<i class="cd${k===c.length-1?' bt':''}" style="background:${COL[x]}">${JP[x]}</i>`).join('')+`</div>`).join('')+`</div></div>`}
function chips(s,fn,selI,dimF){return [...s].map((x,i)=>`<span class="chip${selI===i?' sel':''}${dimF&&dimF(i)?' dim':''}" style="background:${COL[x]}" ${fn?`onclick="${fn}(${i})"`:''}>${JP[x]}</span>`).join('')}
function render(){const A=$('app');
 if(!uid)return;
 if(!code){A.innerHTML=`<h2>星を放つ夜 ONLINE</h2><div class="box">名前 <input id="nm" value="${esc(localStorage.hn||'')}" maxlength="10"><br><button onclick="mk()">部屋を作る</button><br>部屋コード <input id="cd" size="6" inputmode="numeric"><button onclick="jn()">参加</button></div>`;return}
 if(!room){A.textContent='読み込み中…';return}
 if(!g){const ps=Object.entries(room.players).sort((a,b)=>a[1].t-b[1].t),host=room.host===uid;
  A.innerHTML=`<h2>部屋コード：${code}</h2><div class="box">参加者(${ps.length}/5)<br>${ps.map(([,p])=>esc(p.n)+(p.c?'(CPU)':'')).join(' ／ ')}</div>`+
  (host?`<button class="g" onclick="addCpu()">CPUを追加</button><button onclick="start()" ${ps.length<2?'disabled':''}>ゲーム開始</button>`:'ホストの開始を待っています…');return}
 const me=g.pl.findIndex(p=>p.id===uid),mt=myTurn();let ctl='';
 if(g.ph==='over'){ctl=`<h3>🏆 ${esc(g.pl[g.win].name)} の勝利！</h3>`+g.pl.map((p,i)=>esc(p.name)+' '+g.s[i]+'点').join(' ／ ')+`<br><button onclick="location.reload()">最初に戻る</button>`}
 else if(!mt)ctl=`${esc(g.pl[g.t].name)} のターン…`;
 else if(g.ph==='pick')ctl=`ネクストスロットから1組選ぶか、ランダムで引く`;
 else if(g.ph==='place')ctl=`置くカードを選び(${g.free>0?'順不同':'この順で'})、置く列をタップ<br>${chips(g.hand,'setSel',sel,i=>i>=Math.max(g.free,1))}`;
 else if(g.ph==='bonus')ctl=`魔法発動ボーナス：<button class="${mode==='x'?'':'g'}" onclick="setMode('x')">一番下を除外</button><button class="${mode==='d'?'':'g'}" onclick="setMode('d')">山札から1枚配置</button><br>列をタップ`;
 else if(g.ph==='push')ctl=`押し付け：カードを選んで渡す相手を選ぶ(渡した順に相手が置く)<br>${[...g.push].map((x,i)=>{const a=asg.find(a=>a.i===i);return `<span class="chip${ps===i?' sel':''}${a?' dim':''}" style="background:${COL[x]}" onclick="selPush(${i})">${JP[x]}</span>`+(a?'→'+esc(g.pl[a.to].name):'')}).join(' ')}<br>`+
  g.pl.map((p,i)=>i===g.t?'':`<button onclick="giveTo(${i})">${esc(p.name)}</button>`).join('')+`<button class="g" onclick="resetAsg()">やり直し</button>`;
 A.innerHTML=`<div class="box">部屋 ${code} ／ ${esc(g.log)}</div><div class="bds">${g.pl.map((_,i)=>i===me?'':boardH(i,1)).join('')}</div>`+
 `<div class="box">ネクストスロット：${g.nx.map((p,i)=>`<span class="pair">${chips(p)}${mt&&g.ph==='pick'?`<button onclick="pk(${i})">選ぶ</button>`:''}</span>`).join('')}${mt&&g.ph==='pick'?`<button class="g" onclick="pk(-1)">ランダムで引く</button>`:''}</div>`+
 `<div class="box">${ctl}</div>`+(me>=0?boardH(me,0):'')+`<div class="box" style="font-size:12px">20点で最終ターン(全員同回数)。手番順: ${g.pl.map(p=>esc(p.name)).join('→')}</div>`}
</script></body></html>
